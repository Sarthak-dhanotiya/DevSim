# Production requires an SSL-capable database; SPRING_DATASOURCE_URL can override it.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:virtualcompany_db}?sslmode=require}
server.forward-headers-strategy=native
app.frontend-url=${FRONTEND_URL:https://devsim.vercel.app}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Render Free blocks SMTP; production uses HTTPS email delivery.
app.mail.provider=${MAIL_PROVIDER:resend}
