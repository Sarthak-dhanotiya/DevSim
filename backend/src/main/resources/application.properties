# Actual credentials belong in environment variables, never in this file.
spring.application.name=virtualcompany-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:8080}}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# PostgreSQL: a complete JDBC URL overrides the individual connection settings.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:virtualcompany_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# SMTP (optional until email features are used).
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@devsim.com}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.resend-from=${RESEND_FROM:}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Shared Gemini configuration for mentor chat, challenges, tasks and PR reviews.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}
github.token-key=${GITHUB_TOKEN_KEY:}
github.callback-url=${GITHUB_CALLBACK_URL:http://localhost:3000/github/callback}
github.webhook-url=${GITHUB_WEBHOOK_URL:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
github.template=${GITHUB_TEMPLATE_REPO:}
github.repo-mode=${GITHUB_REPO_MODE:TEMPLATE}
github.bot-token=${GITHUB_BOT_TOKEN:}
github.app-id=${GITHUB_APP_ID:}
github.app-slug=${GITHUB_APP_SLUG:}
github.private-key-file=${GITHUB_APP_PRIVATE_KEY_FILE:}

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
logging.level.root=INFO
logging.level.com.virtualcompany=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http.converter=INFO
logging.level.org.springframework.jdbc.core=INFO
